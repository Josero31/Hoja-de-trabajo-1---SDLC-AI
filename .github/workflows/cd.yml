name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build y publicación a GitHub Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Puerta de calidad: no se publica un binario que no pasa los tests.
      - name: Correr tests
        run: pnpm test

      - name: Build de binarios standalone
        run: pnpm build

      - name: Verificar contenido de dist/
        run: ls -lh dist/

      - name: Publicar binarios a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shop502-cart-tui-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
